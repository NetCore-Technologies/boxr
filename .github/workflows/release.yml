name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build all platforms
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GOOS=linux   GOARCH=amd64 go build -o boxr-linux-amd64       ./cmd/boxr
          GOOS=linux   GOARCH=arm64 go build -o boxr-linux-arm64       ./cmd/boxr
          GOOS=windows GOARCH=amd64 go build -o boxr-windows-amd64.exe ./cmd/boxr
          GOOS=darwin  GOARCH=amd64 go build -o boxr-darwin-amd64      ./cmd/boxr
          GOOS=darwin  GOARCH=arm64 go build -o boxr-darwin-arm64      ./cmd/boxr
          tar -czf boxr-${VERSION}-linux-amd64.tar.gz  boxr-linux-amd64
          tar -czf boxr-${VERSION}-linux-arm64.tar.gz  boxr-linux-arm64
          zip       boxr-${VERSION}-windows-amd64.zip  boxr-windows-amd64.exe
          cp boxr-windows-amd64.exe boxr-${VERSION}-windows-amd64.exe
          tar -czf boxr-${VERSION}-darwin-amd64.tar.gz boxr-darwin-amd64
          tar -czf boxr-${VERSION}-darwin-arm64.tar.gz boxr-darwin-arm64

      - name: Build MSI installer
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sudo apt-get install -y wixl
          mkdir -p msi
          cp boxr-windows-amd64.exe msi/boxr.exe
          cat > msi/boxr.wxs << WXS
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="boxr" Language="1033" Version="0.1.0" Manufacturer="NetCore-Technologies" UpgradeCode="12345678-1234-1234-1234-123456789012">
              <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine"/>
              <MediaTemplate EmbedCab="yes"/>
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="INSTALLFOLDER" Name="boxr">
                    <Component Id="boxr.exe" Guid="*">
                      <File Id="boxr.exe" Source="msi/boxr.exe" KeyPath="yes"/>
                    </Component>
                  </Directory>
                </Directory>
              </Directory>
              <Feature Id="ProductFeature" Title="boxr" Level="1">
                <ComponentRef Id="boxr.exe"/>
              </Feature>
            </Product>
          </Wix>
          WXS
          wixl -o boxr-${VERSION}-windows-amd64.msi msi/boxr.wxs

      - name: Build deb package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p deb/boxr_${VERSION}_amd64/DEBIAN
          mkdir -p deb/boxr_${VERSION}_amd64/usr/local/bin
          cp boxr-linux-amd64 deb/boxr_${VERSION}_amd64/usr/local/bin/boxr
          echo "Package: boxr"                                             > deb/boxr_${VERSION}_amd64/DEBIAN/control
          DEB_VERSION=${VERSION#v}
          echo "Version: ${DEB_VERSION}"                                   >> deb/boxr_${VERSION}_amd64/DEBIAN/control
          echo "Architecture: amd64"                                      >> deb/boxr_${VERSION}_amd64/DEBIAN/control
          echo "Maintainer: manit6752025"                                 >> deb/boxr_${VERSION}_amd64/DEBIAN/control
          echo "Description: Mini Docker engine using namespaces+cgroups" >> deb/boxr_${VERSION}_amd64/DEBIAN/control
          dpkg-deb --build deb/boxr_${VERSION}_amd64
          mv deb/boxr_${VERSION}_amd64.deb boxr-${VERSION}-amd64.deb

      - name: Write release notes
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cat > release-notes.md << NOTES
          ## boxr ${VERSION} — Containers from scratch, no Docker required

          A mini Docker engine built from raw Linux syscalls. No Docker. No containerd. No daemon. Just namespaces and cgroups.

          ---

          ## What is in this release

          - PID namespace — container gets its own PID 1, isolated from host
          - UTS namespace — isolated hostname
          - Mount namespace — private filesystem view
          - IPC namespace — isolated interprocess communication
          - cgroup v2 — CPU and memory limits per container
          - Clean CLI — boxr run command

          ---

          ## Install

          Linux one line:
          curl -sL https://github.com/NetCore-Technologies/boxr/releases/download/${VERSION}/install.sh | bash

          Windows PowerShell:
          irm https://github.com/NetCore-Technologies/boxr/releases/download/${VERSION}/install.ps1 | iex

          Debian and Ubuntu:
          wget https://github.com/NetCore-Technologies/boxr/releases/download/${VERSION}/boxr-${VERSION}-amd64.deb
          sudo dpkg -i boxr-${VERSION}-amd64.deb

          ---

          ## Coming in v0.2

          - Network namespace + veth pair (internet inside the container)
          - Overlay filesystem (image layers like real Docker)
          - Pull and run Alpine from Docker Hub with zero Docker installed

          ---

          boxr requires root on Linux to create namespaces.
          Windows and macOS builds compile but full isolation requires Linux kernel.
          NOTES

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: "boxr ${{ steps.version.outputs.VERSION }} — Containers from scratch, no Docker required"
          body_path: release-notes.md
          files: |
            boxr-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
            boxr-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz
            boxr-${{ steps.version.outputs.VERSION }}-windows-amd64.zip
            boxr-${{ steps.version.outputs.VERSION }}-windows-amd64.exe
            boxr-${{ steps.version.outputs.VERSION }}-windows-amd64.msi
            boxr-${{ steps.version.outputs.VERSION }}-darwin-amd64.tar.gz
            boxr-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz
            boxr-${{ steps.version.outputs.VERSION }}-amd64.deb
            install.sh
            install.ps1
