name: Security

# CodeQL scanning is managed by this repository's default setup. This workflow
# verifies Go module integrity and known vulnerabilities without registering a
# conflicting advanced CodeQL configuration.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerability-scan:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: Verify downloaded Go modules
        run: go mod verify

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

